let lang='pt',motivo=null,email='',sel=[];
const $=id=>document.getElementById(id);
function render(){
  document.documentElement.lang=lang;
  document.querySelectorAll('[data-t]').forEach(el=>el.textContent=T[lang][el.dataset.t]);
  $('who').innerHTML=T[lang].who(email);
  $('bpt').classList.toggle('on',lang==='pt');$('bes').classList.toggle('on',lang==='es');
  $('motivos').innerHTML=MOTIVOS.map(m=>`<button type="button" class="motivo" aria-pressed="${motivo===m.id}" onclick="pick('${m.id}')"><span class="ic" aria-hidden="true">${m.ic}</span><b>${m[lang][0]}</b><span class="d">${m[lang][1]}</span></button>`).join('');
  const m=MOTIVOS.find(x=>x.id===motivo);
  $('historia').placeholder=m?m[lang][2]:T[lang].ph;
  renderOpc();
  renderMic();
}
function renderOpc(){
  $('opcoes').innerHTML=motivo?OPC[motivo][lang].map((t,i)=>`<label class="opc"><input type="checkbox" ${sel.includes(i)?'checked':''} onchange="tog(${i},this.checked)"><span>${t}</span></label>`).join(''):`<p class="hint">${T[lang].semMot}</p>`;
}
function tog(i,on){sel=sel.filter(x=>x!==i);if(on)sel.push(i)}
let rec=null,ouvindo=false,base='';
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
function renderMic(){
  if(!SR)return;
  $('microw').style.display='flex';
  $('mic').textContent=ouvindo?T[lang].mParar:T[lang].mFalar;
  $('mic').setAttribute('aria-pressed',ouvindo);
  $('micmsg').textContent=ouvindo?T[lang].mOuve:T[lang].mDica;
}
function mic(){
  if(ouvindo){rec.stop();return}
  rec=new SR();rec.lang=lang==='es'?'es-CU':'pt-BR';rec.continuous=true;rec.interimResults=true;
  base=$('historia').value;if(base&&!/\s$/.test(base))base+=' ';
  rec.onstart=()=>{ouvindo=true;$('err').textContent='';renderMic()};
  rec.onend=()=>{ouvindo=false;renderMic()};
  rec.onerror=e=>{$('err').textContent=(e.error==='not-allowed'||e.error==='service-not-allowed')?T[lang].eMic:T[lang].eMic2};
  rec.onresult=e=>{let t='';for(let i=0;i<e.results.length;i++)t+=e.results[i][0].transcript;$('historia').value=base+t};
  try{rec.start()}catch(x){}
}
function setLang(l){if(ouvindo)rec.stop();lang=l;render()}
function pick(id){if(id!==motivo)sel=[];motivo=id;render()}
function enviar(){
  const t=T[lang],autor=$('autor').value.trim(),nome=$('nome').value.trim(),hist=$('historia').value.trim(),err=$('err');
  err.textContent='';
  if(!autor){err.textContent=t.eAutor;$('autor').focus();return}
  if(!nome){err.textContent=t.eNome;$('nome').focus();return}
  if(!motivo){err.textContent=t.eMot;return}
  if(!sel.length&&!hist){err.textContent=t.eHist;return}
  const m=MOTIVOS.find(x=>x.id===motivo);
  if(ouvindo)rec.stop();
  $('send').disabled=true;
  setTimeout(()=>{$('formArea').style.display='none';$('ok').style.display='block';$('ok').classList.add('show');window.scrollTo(0,0)},500);
}
function novo(){
  $('autor').value='';$('nome').value='';$('setor').value='';$('historia').value='';motivo=null;sel=[];
  $('ok').style.display='none';$('ok').classList.remove('show');$('formArea').style.display='block';$('send').disabled=false;render();window.scrollTo(0,0);
}
render();
email='colaborador@exemplo.com';render();
